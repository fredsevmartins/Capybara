name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=test-results/portable.xml
      - name: Summarize actual test outcomes
        if: ${{ always() && hashFiles('test-results/portable.xml') != '' }}
        run: python scripts/summarize_tests.py test-results/portable.xml
      - name: Save portable test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/portable.xml
          if-no-files-found: warn
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python examples/generate.py --output examples/generated
      - run: openrepro validate examples/generated/pharmacokinetics --json
      - run: openrepro validate examples/generated/dissolution --json
      - run: openrepro validate examples/generated/statistics --json
      - run: python scripts/check_docs.py

  reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Prepare reviewed Python test image
        shell: bash
        run: |
          docker --host=unix:///var/run/docker.sock pull python:3.12-slim
          echo "OPENREPRO_TEST_IMAGE=$(docker --host=unix:///var/run/docker.sock image inspect --format '{{.Id}}' python:3.12-slim)" >> "$GITHUB_ENV"
      - name: Real offline execution and comparison
        run: python -m pytest tests/test_reproduction_docker.py -q --junitxml=test-results/docker.xml
      - name: Summarize Docker outcomes
        if: ${{ always() && hashFiles('test-results/docker.xml') != '' }}
        run: python scripts/summarize_tests.py test-results/docker.xml
      - name: Save Docker test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-docker
          path: test-results/docker.xml
          if-no-files-found: warn
      - name: Resolve dependencies and exercise complete CLI workflow
        run: python scripts/acceptance_smoke.py --output experiments/acceptance-ci --image "$OPENREPRO_TEST_IMAGE" --allow-download --allow-execution
