name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python examples/generate.py --output examples/generated
      - run: openrepro validate examples/generated/pharmacokinetics --json
      - run: openrepro validate examples/generated/dissolution --json
      - run: openrepro validate examples/generated/statistics --json
      - run: python scripts/check_docs.py

  reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Prepare reviewed Python test image
        shell: bash
        run: |
          docker --host=unix:///var/run/docker.sock pull python:3.12-slim
          echo "OPENREPRO_TEST_IMAGE=$(docker --host=unix:///var/run/docker.sock image inspect --format '{{.Id}}' python:3.12-slim)" >> "$GITHUB_ENV"
      - name: Real offline execution and comparison
        run: python -m pytest tests/test_reproduction_docker.py -q
