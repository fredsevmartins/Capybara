name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag version, without v (e.g. 1.0.0rc1)'
        required: true
        type: string
      publish_pypi:
        description: 'Publish verified artifacts using the configured PyPI trusted publisher'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          uv run --frozen --extra dev python -c "import os,openrepro; from packaging.version import Version; value=os.environ['RELEASE_VERSION']; assert str(Version(value)) == value == openrepro.__version__"
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev python scripts/check_docs.py
      - name: Prepare integration image
        run: |
          docker --host=unix:///var/run/docker.sock pull python:3.12-slim
          echo "OPENREPRO_TEST_IMAGE=$(docker --host=unix:///var/run/docker.sock image inspect --format '{{.Id}}' python:3.12-slim)" >> "$GITHUB_ENV"
      - run: uv run --frozen --extra dev python -m pytest -q
      - run: uv run --frozen --extra dev python -m build --no-isolation
      - run: uv run --frozen --extra dev python -m twine check --strict dist/*
      - run: uv run --frozen --extra dev python scripts/check_release.py
      - name: Save verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  pypi:
    if: inputs.publish_pypi
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
